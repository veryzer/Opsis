<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opsis Visitor Count</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --border: #334155;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #0066ff;
        --badge-bg: #111827;
        --badge-border: #263348;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .badge-shell {
        background: var(--badge-bg);
        border: 1px solid var(--badge-border);
        border-radius: 8px;
        padding: 8px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.22);
      }

      .badge {
        background: linear-gradient(180deg, #0f172a 0%, #0a1222 100%);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px 12px;
        min-width: 260px;
      }

      .badge-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .badge-header .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        display: inline-block;
      }

      .count-box {
        background: #0b1220;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 12px 10px;
        text-align: center;
      }

      .count {
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        font-weight: 700;
        color: var(--accent);
        line-height: 1;
      }

      .count-label {
        margin-top: 6px;
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .daily-log {
        width: min(300px, 88vw);
        margin-top: 12px;
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.7);
        border-radius: 6px;
        padding: 8px 10px 10px;
      }

      .daily-log h3 {
        margin: 0 0 8px;
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .daily-log-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 4px 0;
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
        color: var(--text);
        font-size: 12px;
      }

      .daily-log-row:last-child {
        border-bottom: none;
      }
    </style>
  </head>
  <body>
    <div class="badge-shell">
      <div class="badge">
        <div class="badge-header">
          <span class="dot"></span>
          <span>Site visitors</span>
        </div>

        <div class="count-box">
          <div id="visitorCount" class="count">Loading...</div>
          <div class="count-label">Total</div>
        </div>

        <div class="daily-log">
          <h3>Daily visits (AEST)</h3>
          <div id="dailyLog"></div>
        </div>
      </div>
    </div>

    <script>
      const totalKey = 'opsis_visitor_count';
      const dailyKey = 'opsis_daily_log';

      function getSydneyDateKey(date = new Date()) {
        const formatter = new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Australia/Sydney',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        });

        return formatter.format(date);
      }

      function renderDailyLog() {
        const raw = localStorage.getItem(dailyKey);
        const log = raw ? JSON.parse(raw) : {};
        const entries = Object.entries(log).sort(([a], [b]) => a.localeCompare(b));
        const container = document.getElementById('dailyLog');

        container.innerHTML = entries.length
          ? entries.map(([date, count]) => `
            <div class="daily-log-row">
              <span>${date}</span>
              <strong>${Number(count).toLocaleString()}</strong>
            </div>
          `).join('')
          : '<div class="daily-log-row"><span>No visits yet</span><strong>0</strong></div>';
      }

      function loadCounter() {
        const value = Number(localStorage.getItem(totalKey) || 0);
        document.getElementById('visitorCount').textContent = value.toLocaleString();
      }

      function renderPage() {
        loadCounter();
        renderDailyLog();
      }

      renderPage();
      setInterval(renderPage, 60000);
    </script>
  </body>
</html>
