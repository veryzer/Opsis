<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opsis Visitor Count</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #f8fafc;
        font-family: Arial, sans-serif;
      }

      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 2rem 2.5rem;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      }

      .label {
        font-size: 0.9rem;
        color: #94a3b8;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .count {
        margin-top: 0.75rem;
        font-size: clamp(2rem, 6vw, 4rem);
        font-weight: 700;
        color: #0066ff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="label">Site visitors</div>
      <div id="visitorCount" class="count">Loading...</div>
    </div>

    <script>
      function loadCounter() {
        const key = 'opsis_visitor_count';
        const value = Number(localStorage.getItem(key) || 0);
        document.getElementById('visitorCount').textContent = value.toLocaleString();
      }

      loadCounter();
      setInterval(loadCounter, 60000);
    </script>
  </body>
</html>
